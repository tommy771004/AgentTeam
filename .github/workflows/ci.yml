# AgentStudio — dual-platform verify (app/)
# Runs build + stable smoke matrix on Ubuntu and Windows.
# Linux additionally proves the bubblewrap builtin-shell sandbox (ADR-0051).
# Marketplace E2E is optional (continue-on-error) due to Electron/CJS fragility.

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint src electron

      - name: Resolve PR complexity base
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "COMPLEXITY_PR_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"

      - name: Deterministic qualification (no App launch)
        run: npm run qualify:deterministic

      - name: Typecheck + Vite build
        run: npm run build

      - name: Smoke (CI stable matrix)
        run: npm run smoke:ci

      # ADR-0051 / issue 14: the bubblewrap builtin-shell adapter can only be
      # PROVEN where a Linux kernel can answer — a view escape and outbound
      # network have to actually fail, not be reasoned about. The smoke reports
      # honestly on other platforms, so this job is the only place its
      # kernel-settled assertions ever run.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Builtin shell sandbox — bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          bwrap --version
          npm run build:pi-host
          node --experimental-strip-types scripts/smoke-pi-bwrap-builtin-shell.mts

      - name: Smoke built Electron contract (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:built

      - name: Smoke built Electron contract (Windows)
        if: runner.os == 'Windows'
        run: npm run smoke:built

  marketplace:
    name: marketplace e2e (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Marketplace installer E2E
        run: npm run smoke:marketplace
