# AgentStudio — platform-separated blocking verification
# Ubuntu + Windows own the common build/stable smoke matrix. Linux additionally
# proves bubblewrap, while macOS owns only its native unsigned runtime contracts.
# Marketplace E2E is optional (continue-on-error) due to Electron/CJS fragility.

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'vendor/pi/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'docs/adr/**'
      - 'docs/SECURITY_BASELINE.md'
      - 'docs/RELEASE_SIGNING_SETUP.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'vendor/pi/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'docs/adr/**'
      - 'docs/SECURITY_BASELINE.md'
      - 'docs/RELEASE_SIGNING_SETUP.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint src electron

      - name: Resolve PR complexity base
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "COMPLEXITY_PR_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"

      - name: Deterministic qualification (no App launch)
        run: npm run qualify:deterministic

      - name: Typecheck + Vite build
        run: npm run build

      - name: Smoke (CI stable matrix)
        run: npm run smoke:ci

      - name: Smoke built Electron contract (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:built

      - name: Smoke built Electron contract (Windows)
        if: runner.os == 'Windows'
        run: npm run smoke:built

  # One Linux owner exercises the complete shipped Pi compatibility graph.
  # This is intentionally separate from the OS matrix so vendored source and
  # pin-only PRs cannot pass on compilation alone.
  pi-runtime:
    name: Pi shipped-runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ADR-0051: the Pi runtime owner also provisions the Linux kernel adapter
      # used by its qualification, so the proof is neither implicit nor duplicated.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Pi runtime compatibility
        run: |
          bwrap --version
          npm run qualify:pi-runtime-contract

  # PR evidence only: native runtime contracts, never packaging/signing or a
  # customer-facing publish. Production trust evidence remains release-owned.
  macos-runtime:
    name: macOS runtime contracts (unsigned)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: macOS platform runtime contract
        run: npm run qualify:macos-runtime-contract

  marketplace:
    name: marketplace e2e (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Marketplace installer E2E
        run: npm run smoke:marketplace
