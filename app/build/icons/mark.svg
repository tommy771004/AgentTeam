<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgentStudio — Brand mark (transparent)

  The app-icon tile (icon.svg) keeps its cyan squircle, because macOS and
  Windows expect an app icon to carry its own shape. This is the tile-less
  variant for README, docs, web and any surface that supplies its own
  background.

  Two deliberate differences from icon.svg, both required for it to survive on
  a transparent ground:

  1. Brand cyan, not white. The tiled icon draws the mark in white on cyan;
     white on nothing is invisible on a light page. Every stroke here is the
     brand cyan ramp, and each node is a cyan ring around a white core so the
     shape reads on both light and dark surfaces.
  2. No blur filter. icon.svg softens the mark against its tile; with nothing
     behind it that same blur becomes a halo tracing the shape's own outline.

  viewBox is cropped to the artwork's real bounds, not to a symmetric circle.
  The mark is taller than it is wide (the top node reaches 320 from centre, the
  orbit stroke only ~286), so a viewBox centred on 512,512 leaves the top node
  visibly closer to the edge than everything else. It is centred on the content
  box (512, 495) instead, which puts equal margin above and below.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="184 166 657 657" fill="none" role="img" aria-label="AgentStudio">
  <defs>
    <linearGradient id="orbit" x1="280" y1="240" x2="760" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Continuous agent loop (the product: loop engine) -->
  <g transform="translate(512 512)">
    <!-- Outer orbit -->
    <circle r="268" stroke="url(#orbit)" stroke-width="36" stroke-linecap="round"
            stroke-dasharray="720 168" transform="rotate(-28)" fill="none"/>
    <!-- Inner orbit (counter-phase = multi-agent concurrency) -->
    <circle r="168" stroke="url(#orbit)" stroke-width="28" stroke-linecap="round"
            stroke-dasharray="420 110" transform="rotate(52)" fill="none" opacity="0.92"/>

    <!-- Three role nodes: cyan ring + white core reads on either ground -->
    <!-- Top -->
    <g transform="rotate(-90) translate(268 0)">
      <circle r="52" fill="#0891b2"/>
      <circle r="36" fill="#ffffff"/>
    </g>
    <!-- Bottom-right -->
    <g transform="rotate(30) translate(268 0)">
      <circle r="52" fill="#0891b2"/>
      <circle r="36" fill="#ffffff"/>
    </g>
    <!-- Bottom-left -->
    <g transform="rotate(150) translate(268 0)">
      <circle r="52" fill="#0891b2"/>
      <circle r="36" fill="#ffffff"/>
    </g>

    <!-- Core nucleus: single objective / shared state -->
    <circle r="58" fill="#0e7490"/>
    <circle r="40" fill="#ffffff"/>
    <circle r="16" fill="#22d3ee"/>
  </g>
</svg>
