<?xml version="1.0" encoding="UTF-8"?>
<!--
  SubAgents AI — App Icon
  Concept: multi-agent orbital loop (3 role nodes + continuous cycle)
  Style: squircle app tile like Claude / Gemini / OpenAI model chips
  Palette: project primary cyan on deep navy core
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="SubAgents AI">
  <defs>
    <!-- Solid-feel gradient for slight depth without looking generic AI -->
    <linearGradient id="tile" x1="120" y1="40" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8d4"/>
      <stop offset="55%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="mark" x1="280" y1="240" x2="760" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f7ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle tile (~22% corner radius, app-icon standard) -->
  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>

  <!-- Inner soft vignette ring (very subtle) -->
  <rect x="48" y="48" width="928" height="928" rx="196" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" fill="none"/>

  <!-- Continuous agent loop (the product: loop engine) -->
  <g transform="translate(512 512)" filter="url(#soft)">
    <!-- Outer orbit -->
    <circle r="268" stroke="url(#mark)" stroke-width="36" stroke-linecap="round"
            stroke-dasharray="720 168" transform="rotate(-28)" fill="none"/>
    <!-- Inner orbit (counter-phase = multi-agent concurrency) -->
    <circle r="168" stroke="url(#mark)" stroke-width="28" stroke-linecap="round"
            stroke-dasharray="420 110" transform="rotate(52)" fill="none" opacity="0.92"/>

    <!-- Three role nodes: Manager / Analyzer / Writer (or Core triad) -->
    <!-- Top -->
    <g transform="rotate(-90) translate(268 0)">
      <circle r="52" fill="#0b1326"/>
      <circle r="36" fill="#ffffff"/>
    </g>
    <!-- Bottom-right -->
    <g transform="rotate(30) translate(268 0)">
      <circle r="52" fill="#0b1326"/>
      <circle r="36" fill="#ffffff"/>
    </g>
    <!-- Bottom-left -->
    <g transform="rotate(150) translate(268 0)">
      <circle r="52" fill="#0b1326"/>
      <circle r="36" fill="#ffffff"/>
    </g>

    <!-- Core nucleus: single objective / shared state -->
    <circle r="58" fill="#0b1326"/>
    <circle r="40" fill="#ffffff"/>
    <circle r="16" fill="#22d3ee"/>
  </g>
</svg>
