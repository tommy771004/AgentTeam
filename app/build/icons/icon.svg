<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgentStudio app icon.
  Deterministic high-resolution reconstruction of the supplied 39x36 source:
  one connected white/ice-blue cluster plus one independent amber node.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="AgentStudio">
  <!-- Transparent safe area lets macOS and Windows apply their own masks. -->
  <rect x="80" y="80" width="864" height="864" rx="216" fill="#0075DE"/>

  <!-- Orthogonal links sit behind the nodes so every join remains clean. -->
  <path d="M377 377H620M377 377V647" stroke="#FFFFFF" stroke-width="54"/>

  <!-- Connected nodes. -->
  <rect x="296" y="296" width="162" height="162" rx="41" fill="#FFFFFF"/>
  <rect x="539" y="296" width="162" height="162" rx="41" fill="#D6E5F9"/>
  <rect x="296" y="566" width="162" height="162" rx="41" fill="#D6E5F9"/>

  <!-- Independent node. -->
  <rect x="539" y="566" width="162" height="162" rx="41" fill="#FEB10F"/>
</svg>
